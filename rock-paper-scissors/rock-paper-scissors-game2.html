<!DOCTYPE html>
<html>
  <head>

    

    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="rock-paper-scissors.css">
  </head>
  <body style="
  background-color: black;">
  <p class="razane">By Razène</p>
    <div class="div">

    <p class="title">Rock Paper Scissors</p>
    <button class="b1 move-button js-rock-button">
      <img class="move-photo" src="rock-emoji.png">
    </button>
    <button class="b2 move-button js-paper-button">
      <img class="move-photo" src="paper-emoji.png">
    </button>
    <button class="b3 move-button js-scissors-button">
    <img class="move-photo" src="scissors-emoji.png">

    <p class="result-play result"></p>
    <p class="chose-player-computer game"></p></p>
    <p class="js-score score"></p>


     <button  class="b4 reset">
      Reset score
     </button>
     <button class="auto-play js-auto-play" onclick="autoPlay(); changeNameButton(); ">Auto play</button>
     <div class="confirmation-div"></div>
    </div>
  
    <script src="rock-paper-scissors.js"></script>
  </body>
  
</html>
