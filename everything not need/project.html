<!DOCTYPE html>
<html>
<head>
<style>

.profile-picture{
  width:47px;
  height:47px;
  border-radius:50px;
  object-fit:cover;

}
p{
font-family:Arial;

}
.name{
  font-weight:bold;
  margin-bottom:4px;

.bottom2{

}
