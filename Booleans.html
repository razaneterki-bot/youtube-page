<html>
  <head>
    <title>Booleans</title>
  </head>
  <body>

    <button onclick="
       if(CartQuantity >= 0 && CartQuantity < 10){
        CartQuantity += 1;
        console.log(`The current cart quantity is : ${CartQuantity}`);
       }else if(CartQuantity === 10){
        alert('The cart is full');
        }">
       CartQuantity
       </button>


      <button onclick="
      if(CartQuantity > 0){
        CartQuantity -= 1;
        console.log(`The current cart quantity is : ${CartQuantity}`);
      }else if(CartQuantity === 0){
        alert('Not enough items in the cart');
      }">
        Remove from cart
      </button>


        
    
  </body>
